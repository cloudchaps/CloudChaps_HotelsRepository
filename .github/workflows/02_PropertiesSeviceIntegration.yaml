---
name: Build AWS infrastucture via cloud Formation
on:
  push:
    branches: [ development ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest commit from repo
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21 
      uses: actions/setup-java@v4 
      with: 
        distribution: 'temurin' 
        java-version: '21'
    
    - name: Build with Maven 
      run: mvn clean package -f 01_Properties/pom.xml -DskipTests=true
    
    - name: cd into the application folder
      run: cd 01_Properties && ls -la && ls -la target
    
    - name: Rename artifact 
      run: | 
        cp 01_Properties/target/*.war properties.war

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-war
        path: 01_Properties/target/*.war
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: app-war
        path: target
    
    - name: list files
      run: ls -la target && ls -la

    - name: Copy WAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with: 
        host: ${{ secrets.HOST }} 
        username: ubuntu
        key: ${{ secrets.SSH_KEY }} 
        source: "target/Properties-0.0.1.war" 
        target: "/tmp" 
      
    - name: Deploy to Tomcat 
      uses: appleboy/ssh-action@v1.0.3 
      with: 
        host: ${{ secrets.HOST }} 
        username: ubuntu
        key: ${{ secrets.SSH_KEY }} 
        script: | 
          # Stop Tomcat 
          sudo systemctl stop tomcat10 
          sudo ls -al /tmp &&
          # Remove old app (optional) 
          sudo rm -rf /var/lib/tomcat10/webapps/ROOT
          # Move new WAR 
          sudo mv /tmp/Properties-0.0.1.war /var/lib/tomcat10/webapps/ROOT.war
          # Fix permissions (important)
          sudo chown tomcat:tomcat /var/lib/tomcat10/webapps/ROOT.war 
          # Start Tomcat 
          sudo systemctl restart tomcat10

