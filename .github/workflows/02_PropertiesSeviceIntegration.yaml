---
name: Build AWS infrastucture via cloud Formation
on:
  push:
    branches: [ development ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest commit from repo
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21 
      uses: actions/setup-java@v4 
      with: 
        distribution: 'temurin' 
        java-version: '21'
    
    - name: cd into the application folder
      run: cd 01_Properties && ls -la
    
    - name: Build with Maven 
      run: mvn clean package -f 01_Properties/pom.xml -DskipTests=true
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-war
        path: 01_Properties/target/*.war
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: app-war
        path: target
    
    - name: list files
      run: ls -la target && ls -la

    - name: Deploy to web server
      uses: moonpathbg/scp_uploader@latest
      with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key : ${{ secrets.SSH_KEY }}
          source: "./target/Properties-0.0.1.war"
          target: "/var/lib/tomcat10/webapps/properties-0.0.1.war"
    
    
  

