---
AWSTemplateFormatVersion: "2010-09-09"
Description: Create Service Roles for cloudchaps hotels Properties API

Parameters:
  CCDevUserName:
    Type: String
    Description: The name of the IAM user who will be granted access to the service role
    Default: CloucChaps_PropertiesManagement

Resources:
  # Create a policy to manage EC2 instances and Cloudformation stacks following the least privilege principle
  CCEC2ServiceRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: CCEC2ServiceRolePolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EC2ReadAccess
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeImages
              - ec2:DescribeKeyPairs
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
            Resource: "*"
          
          - Sid: EC2WriteAccess
            Effect: Allow
            Action:
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:TerminateInstances
              - ec2:RunInstances
              - ec2:CreateTags
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
            Resource:
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*"
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:key-pair/*"
              - !Sub "arn:aws:ec2:${AWS::Region}::image/*"

          - Sid: CloudFormationAccess
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DescribeChangeSet
              - iam:PassRole
            Resource:
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/*/*"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/*"

  CCVPCServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CCDevEC2InfraServiceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFormation
            Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole

          - Sid: AllowIAMUser
            Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:user/${CCDevUserName}"
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CCEC2ServiceRolePolicy